<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabelCrop AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <img src="icons/icon-48.png" alt="LabelCrop AI Logo" class="logo">
        <div>
          <h1 class="title">LabelCrop <span>AI</span></h1>
          <p class="subtitle">E-Commerce Thermal Label Cropper</p>
        </div>
      </div>
      <span class="badge">100% Free</span>
    </header>

    <div class="primary-action">
      <button id="btn-open-main" class="btn btn-primary">
        <span class="icon">🚀</span>
        <span class="btn-text">
          <strong>Open Label Cropper</strong>
          <small>Crop Meesho, Flipkart & Amazon PDFs</small>
        </span>
      </button>
    </div>

    <!-- Android App Callout Banner -->
    <div class="app-banner" id="btn-playstore" data-url="https://play.google.com/store/apps/details?id=ecom.label.crop.tool&hl=en" title="Download official Android App on Google Play">
      <div class="play-badge">
        <svg class="play-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M3.61 2.22c-.22.24-.36.6-.36 1.07v17.42c0 .47.14.83.36 1.07l.06.06 9.77-9.78v-.23L3.67 2.16l-.06.06z"/>
          <path fill="#FBBC04" d="M16.69 15.3l-3.25-3.24v-.23l3.25-3.24.08.04 3.84 2.18c1.1.62 1.1 1.64 0 2.27l-3.84 2.18-.08.04z"/>
          <path fill="#EA4335" d="M16.77 15.26L13.44 11.9 3.61 21.73c.36.38.96.43 1.64.04l11.52-6.51z"/>
          <path fill="#34A853" d="M16.77 8.54L5.25 2.03C4.57 1.64 3.97 1.69 3.61 2.07l9.83 9.83 3.33-3.36z"/>
        </svg>
        <div class="play-text">
          <span class="play-sub">GET IT ON</span>
          <span class="play-title">Google Play</span>
        </div>
      </div>
      <span class="play-tag">📱 Android App ↗</span>
    </div>

    <div class="section-label">Quick Marketplace Tools</div>
    <div class="grid-tools">
      <button class="tool-card" data-url="https://labelcropai.web.app/meesho-label-crop">
        <span class="tool-dot dot-meesho"></span>
        <span class="tool-name">Meesho 4×6</span>
      </button>
      <button class="tool-card" data-url="https://labelcropai.web.app/flipkart-label-crop">
        <span class="tool-dot dot-flipkart"></span>
        <span class="tool-name">Flipkart 4×6</span>
      </button>
      <button class="tool-card" data-url="https://labelcropai.web.app/amazon-label-crop">
        <span class="tool-dot dot-amazon"></span>
        <span class="tool-name">Amazon 4×6</span>
      </button>
      <button class="tool-card" data-url="https://labelcropai.web.app/bulk-pdf-label-crop-merge">
        <span class="tool-dot dot-bulk"></span>
        <span class="tool-name">Bulk PDF Merge</span>
      </button>
    </div>

    <div class="section-label">More Utilities</div>
    <div class="list-tools">
      <button class="list-item" data-url="https://labelcropai.web.app/sku-picklist-generator">
        <span class="item-icon">📋</span>
        <span class="item-title">SKU Picklist Generator</span>
      </button>
      <button class="list-item" data-url="https://labelcropai.web.app/4x6-thermal-label-cropper">
        <span class="item-icon">🖨️</span>
        <span class="item-title">Thermal Printer Setup (TVS, TSC, Zebra)</span>
      </button>
    </div>

    <footer class="footer">
      <div class="security-note">
        <span class="lock-icon">🔒</span>
        <span>100% In-Browser Privacy (Zero File Uploads)</span>
      </div>
      <a href="#" id="link-website" class="site-link">labelcropai.web.app ↗</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
